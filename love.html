<!DOCTYPE html>
<html>
<head>
    <title>Love U</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        h1 {
            color: pink;
            font-size: 50px;
            text-align: center;
            text-shadow: 0 0 10px pink, 0 0 20px red;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>❤️ Love u love u ❤️</h1>

</body>
</html>
